<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE ANIME STORE | Cart</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050510;
color:#fff;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
position:sticky;
top:0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:28px;
font-weight:800;
background:linear-gradient(90deg,#00E5FF,#7B61FF,#FF2D75);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
}

.container{
width:90%;
max-width:1200px;
margin:40px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
}

.cart-box,
.summary{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:20px;
padding:25px;
}

.cart-item{
display:flex;
gap:20px;
align-items:center;
padding:20px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.cart-item img{
width:120px;
height:120px;
object-fit:cover;
border-radius:15px;
}

.info{
flex:1;
}

.price{
color:#00E5FF;
font-size:22px;
font-weight:700;
margin-top:8px;
}

.qty{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
}

.qty button{
width:35px;
height:35px;
border:none;
border-radius:50%;
background:#00E5FF;
cursor:pointer;
font-size:18px;
}

.remove{
margin-top:15px;
background:#FF2D75;
border:none;
color:white;
padding:10px 18px;
border-radius:30px;
cursor:pointer;
}

.summary h2{
margin-bottom:20px;
}

.row{
display:flex;
justify-content:space-between;
margin:18px 0;
}

.checkout{
width:100%;
padding:15px;
border:none;
border-radius:40px;
background:linear-gradient(90deg,#00E5FF,#7B61FF);
color:white;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.empty{
text-align:center;
padding:80px 20px;
display:none;
}

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

.cart-item{

flex-direction:column;
text-align:center;

}

}

</style>

</head>

<body>

<nav>

<div class="logo">

THE ANIME STORE

</div>

<div>

<a href="index.html">Home</a>

<a href="shop.html">Shop</a>

<a href="wishlist.html">Wishlist</a>

</div>

</nav>

<div class="container">

<div class="cart-box">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div class="empty" id="emptyCart">

<h2>🛒 Your cart is empty</h2>

<p>Go back to the shop and add your favourite anime products.</p>

</div>

</div>

<div class="summary">

<h2>Order Summary</h2>

<div class="row">

<span>Subtotal</span>

<span id="subtotal">₹0</span>

</div>

<div class="row">

<span>Shipping</span>

<span>FREE</span>

</div>

<hr>

<div class="row">

<strong>Total</strong>

<strong id="total">₹0</strong>

</div>

<button class="checkout">

Proceed to Checkout

</button>

</div>

</div>

</body>
</html>
