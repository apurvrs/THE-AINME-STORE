<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE ANIME STORE | Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050510;
color:white;
overflow-x:hidden;
}

/* Background Glow */

body::before{
content:"";
position:fixed;
width:500px;
height:500px;
background:#00E5FF;
filter:blur(180px);
top:-200px;
left:-180px;
opacity:.15;
z-index:-1;
}

body::after{
content:"";
position:fixed;
width:500px;
height:500px;
background:#7B61FF;
filter:blur(180px);
bottom:-200px;
right:-180px;
opacity:.15;
z-index:-1;
}

/* Navbar */

nav{

position:sticky;
top:0;
z-index:1000;

display:flex;
justify-content:space-between;
align-items:center;

padding:20px 8%;

background:rgba(10,10,20,.6);
backdrop-filter:blur(18px);

border-bottom:1px solid rgba(255,255,255,.08);

}

.logo{

font-size:28px;
font-weight:800;

background:linear-gradient(90deg,#00E5FF,#7B61FF,#FF2D75);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

nav ul{

display:flex;
gap:28px;
list-style:none;

}

nav a{

text-decoration:none;
color:white;
transition:.3s;

}

nav a:hover{

color:#00E5FF;

}

.cart-btn{

padding:12px 22px;

border:none;
border-radius:40px;

background:linear-gradient(90deg,#00E5FF,#7B61FF);

color:white;

cursor:pointer;

}

/* Heading */

header{

padding:70px 20px 40px;
text-align:center;

}

header h1{

font-size:54px;
margin-bottom:15px;

}

header p{

color:#cccccc;
max-width:700px;
margin:auto;

}

/* Toolbar */

.toolbar{

width:90%;
max-width:1200px;

margin:auto;

display:flex;
flex-wrap:wrap;
gap:18px;

justify-content:center;

margin-bottom:40px;

}

.toolbar input,
.toolbar select{

padding:15px 18px;

border:none;
outline:none;

border-radius:40px;

background:rgba(255,255,255,.06);

color:white;

min-width:240px;

}

/* Product Grid */

.products{

width:90%;
max-width:1300px;

margin:auto;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:30px;

padding-bottom:70px;

}

.product{

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:20px;

overflow:hidden;

transition:.4s;

position:relative;

}

.product:hover{

transform:translateY(-10px);

box-shadow:0 0 25px rgba(0,229,255,.25);

}

.product img{

width:100%;
height:250px;

object-fit:cover;

}

.tag{

position:absolute;

top:15px;
left:15px;

background:#FF2D75;

padding:6px 14px;

border-radius:20px;

font-size:12px;

}

.info{

padding:20px;

}

.info h3{

margin-bottom:12px;

}

.rating{

color:#FFD700;
margin-bottom:10px;

}

.price{

font-size:24px;
font-weight:700;
color:#00E5FF;

margin-bottom:15px;

}

.buttons{

display:flex;
gap:10px;

}

.buttons button{

flex:1;

padding:12px;

border:none;

border-radius:30px;

cursor:pointer;

font-weight:600;

}

.cart{

background:linear-gradient(90deg,#00E5FF,#7B61FF);

color:white;

}

.buy{

background:white;

color:#111;

}

/* Mobile */

@media(max-width:768px){

nav ul{

display:none;

}

header h1{

font-size:38px;

}

}

/* Wishlist */

.wishlist{

position:absolute;

top:15px;

right:15px;

width:42px;

height:42px;

display:flex;

justify-content:center;

align-items:center;

border-radius:50%;

background:rgba(0,0,0,.45);

cursor:pointer;

font-size:22px;

transition:.3s;

}

.wishlist.active{

background:#ff2d75;

transform:scale(1.1);

}

.product.hidden{

display:none;

}

.product:hover img{

transform:scale(1.08);

transition:.5s;

}

.product img{

transition:.5s;

}

</style>

</head>

<body>

<nav>

<div class="logo">

THE ANIME STORE

</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="shop.html">Shop</a></li>

<li><a href="#">Wishlist</a></li>

<li><a href="#">Contact</a></li>

</ul>

<button class="cart-btn">

🛒 Cart

</button>

</nav>

<header>

<h1>

Anime Shop

</h1>

<p>

Browse our premium collection of anime hoodies,
figures, manga, posters and accessories.

</p>

</header>

<div class="toolbar">

<input
type="text"
placeholder="🔍 Search products..."
id="search">

<select id="category">

<option>All Categories</option>

<option>Clothing</option>

<option>Figures</option>

<option>Accessories</option>

<option>Manga</option>

</select>

<select id="sort">

<option>Sort By</option>

<option>Price: Low to High</option>

<option>Price: High to Low</option>

<option>Newest</option>

</select>

</div>

<section class="products">

<div class="product" data-category="Clothing" data-price="1999">

<span class="tag">NEW</span>

<img src="https://picsum.photos/400/400?random=1">

<div class="info">

<h3>Naruto Hoodie</h3>

<div class="rating">

⭐⭐⭐⭐⭐

</div>

<div class="price">

₹1,999

</div>

<div class="buttons">

<button class="cart">

Add Cart

</button>

<button class="buy">

Buy Now

</button>

</div>

</div>

</div>

<div class="product" data-category="Clothing" data-price="999">

<span class="tag">HOT</span>

<img src="https://picsum.photos/400/400?random=2">

<div class="info">

<h3>Gojo T-Shirt</h3>

<div class="rating">

⭐⭐⭐⭐☆

</div>

<div class="price">

₹999

</div>

<div class="buttons">

<button class="cart">

Add Cart

</button>

<button class="buy">

Buy Now

</button>

</div>

</div>

</div>

<div class="product" data-category="Figures" data-price="3499">

<span class="tag">SALE</span>

<img src="https://picsum.photos/400/400?random=3">

<div class="info">

<h3>One Piece Figure</h3>

<div class="rating">

⭐⭐⭐⭐⭐

</div>

<div class="price">

₹3,499

</div>

<div class="buttons">

<button class="cart">

Add Cart

</button>

<button class="buy">

Buy Now

</button>

</div>

</div>

</div>

<div class="product" data-category="Accessories" data-price="4299">

<span class="tag">LIMITED</span>

<img src="https://picsum.photos/400/400?random=4">

<div class="info">

<h3>Anime Headset</h3>

<div class="rating">

⭐⭐⭐⭐⭐

</div>

<div class="price">

₹4,299

</div>

<div class="buttons">

<button class="cart">

Add Cart

</button>

<button class="buy">

Buy Now

</button>

</div>

</div>

</div>

</section>

<script>

const products=document.querySelectorAll(".product");

/* Add Wishlist Button */

products.forEach(product=>{

const heart=document.createElement("div");

heart.className="wishlist";

heart.innerHTML="🤍";

product.appendChild(heart);

heart.onclick=()=>{

heart.classList.toggle("active");

heart.innerHTML=

heart.classList.contains("active")

?"❤️"

:"🤍";

};

});

/* Search */

const search=document.getElementById("search");

search.addEventListener("keyup",()=>{

const value=search.value.toLowerCase();

products.forEach(product=>{

const name=

product.querySelector("h3").innerText.toLowerCase();

product.classList.toggle(

"hidden",

!name.includes(value)

);

});

});

/* Category Filter */

const category=document.getElementById("category");

category.addEventListener("change",()=>{

const selected=category.value;

products.forEach(product=>{

if(

selected==="All Categories"

||

product.dataset.category===selected

){

product.classList.remove("hidden");

}else{

product.classList.add("hidden");

}

});

});

/* Sort */

const sort=document.getElementById("sort");

sort.addEventListener("change",()=>{

const container=document.querySelector(".products");

const list=[...products];

list.sort((a,b)=>{

const pa=+a.dataset.price;

const pb=+b.dataset.price;

if(sort.value==="Price: Low to High") return pa-pb;

if(sort.value==="Price: High to Low") return pb-pa;

return 0;

});

list.forEach(item=>container.appendChild(item));

});

/* Add To Cart */

document.querySelectorAll(".cart").forEach(button=>{

button.onclick=()=>{

button.innerHTML="✓ Added";

button.style.background="#18b418";

setTimeout(()=>{

button.innerHTML="Add Cart";

button.style.background="linear-gradient(90deg,#00E5FF,#7B61FF)";

},1500);

};

});

</script>

</body>
</html>
